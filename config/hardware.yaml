# Hardware configuration — GPIO pins, I2C addresses, PWM channels
# All pin numbers are BCM GPIO numbering
# Last corrected: 2026-05-14 against CONTEXT_Part2.md wiring table v2.0

simulation:
  enabled: auto           # auto (detect hardware), always, never
  noise_level: 0.05       # 5% Gaussian noise on sensor values
  latency_simulation: true
  scenario: null          # path to scenario file for replay

i2c:
  bus: 1                  # /dev/i2c-1

motors:
  driver: TB6612FNG
  boards: 1               # single TB6612FNG (right board) — left board disconnected, caster wheel at rear
  stby: 27                # GPIO27 — shared STBY, active HIGH = enabled (Pin 13)
  max_speed: 100          # % 0-100
  default_speed: 60       # % 0-100
  ramp_ms: 150            # acceleration ramp in ms (was 200, tuned 2026-05-20)
  stall_detect_ms: 500    # ms without encoder change = stall
  left_trim: 1.000        # global left-side scale (legacy — prefer per-motor trim below)
  right_trim: 1.000       # global right-side scale (legacy)
  # Per-motor trim — calibrate by running timed test and adjusting until all spin equal
  # RR is strongest on this unit; LF is weakest — adjust these values empirically
  trim:
    LF: 1.00              # left  front — boost if weakest
    LR: 1.00              # left  rear
    RF: 1.00              # right front
    RR: 1.00              # right rear  — reduce if strongest
  # Board 1 — LEFT side
  # WARNING: GPIO12=PWM0_Alt0 and GPIO18=PWM0_Alt5 are the SAME HW PWM channel.
  # GPIO13=PWM1_Alt0 and GPIO19=PWM1_Alt5 are the SAME HW PWM channel.
  # NEVER add dtoverlay=pwm or dtoverlay=pwm-2chan — it couples left+right speeds.
  # Software PWM (thread-based) is intentional and required for independent control.
  left_front:
    ain1: 17              # GPIO17 (Pin 11)
    ain2: 22              # GPIO22 (Pin 15)
    pwm:  11              # GPIO11 (Pin 23) — REMAPPED from GPIO12 (Pin 32 faulty on this unit)
  left_rear:
    bin1: 23              # GPIO23 (Pin 16)
    bin2: 10              # GPIO10 (Pin 19) — MOVED from GPIO6: FIT0992 HAT uses GPIO6 (Pin 31) for adapter-fail detection
    pwm:  13              # GPIO13 (Pin 33) — SW PWM only
  # Board 2 — RIGHT side (freed I2S pins: GPIO18-21; GPIO25/26 freed from unconnected sensors)
  right_front:
    ain1: 20              # GPIO20 (Pin 38) — freed I2S DIN
    ain2: 24              # GPIO24 (Pin 18) — REMAPPED: GPIO21 dead → GPIO14 UART conflict → GPIO5 dead → GPIO24
    pwm:  18              # GPIO18 (Pin 12) — SW PWM only (shares HW PWM0 with GPIO12)
  right_rear:
    bin1: 25              # GPIO25 (Pin 22) — freed from touch-belly
    bin2: 26              # GPIO26 (Pin 37) — freed from vibration sensor
    pwm:   9              # GPIO9  (Pin 21) — REMAPPED from GPIO19 (Pin 35 faulty on this unit)

servos:
  driver: PCA9685
  i2c_address: 0x40
  frequency: 50           # Hz
  channels:
    camera_pan: 0
    camera_tilt: 1
    ultrasonic_rotate: 2
  limits:
    camera_pan:   { min: 30, max: 150, center: 90 }
    camera_tilt:  { min: 60, max: 120, center: 90 }
    ultrasonic_rotate: { min: 0, max: 180, center: 90 }

displays:
  left_eye:
    i2c_address: 0x3C
    width: 128
    height: 64
    driver: SSD1306
  right_eye:
    i2c_address: 0x3D     # A0 pad bridged with solder blob for 0x3D
    width: 128
    height: 64
    driver: SSD1306

sensors:
  bh1750:
    i2c_address: 0x23
    mode: continuous_high_res
    available: true        # wired and tested

  mpu6050:
    i2c_address: 0x68
    available: false       # set true when wired

  ultrasonic:
    trigger_pin: 15        # GPIO15 (Pin 22) — remapped from GPIO16 (FIT0992 HAT charges-disable, never touch)
    echo_pin: 14           # GPIO14 (Pin 8) — remapped from GPIO24 (GPIO24 taken by right_front AIN2)
    timeout_s: 0.03
    max_distance_cm: 400
    available: false       # set true when HC-SR04 wired with LLC voltage divider on ECHO

  pir:
    pin: 8                 # GPIO8  — CORRECTED from 16 (was conflicting with HC-SR04 TRIG)
    warmup_s: 30
    available: false       # set true when wired

  apds9960:
    i2c_address: 0x39
    int_pin: null          # GPIO9 conflicts with right_rear motor PWM; GPIO12/19/21 all dead on this unit — use I2C polling
    available: false       # set true when pin headers soldered and wired

  touch:
    # GPIO4 and GPIO7 confirmed DEAD on this Pi unit (2026-05-28)
    # GPIO25 (belly) taken by right_rear BIN1 — no free pin for belly
    pins: [5]              # head=GPIO5 only — left/right/belly have no usable GPIOs
    available: false       # set true when wired

  cliff:
    pins: []               # GPIO14/15 reassigned to ultrasonic TRIG/ECHO; GPIO20/21 dead; no free GPIOs left
    available: false       # cannot wire on this unit without I2C GPIO expander (MCP23017)

  vibration:
    pin: null              # GPIO26 taken by right_rear BIN2 — reassign when wiring sensors
    available: false

  sound:
    pin: null              # GPIO11 conflicts with left_front motor PWM; GPIO12/19/21 all dead on this unit — no free GPIO
    available: false       # cannot wire on this unit without I2C GPIO expander

battery:
  ups_hat:
    i2c_address: 0x36
    driver: MAX17043
    available: true        # wired and working
  lipo:
    critical_voltage: 6.8
    low_voltage: 7.0
    full_voltage: 8.4
    cells: 2

camera:
  device: 0               # /dev/video0 (Logitech C920 USB)
  width: 320
  height: 240
  fps: 30
  backend: opencv

audio:
  mic:
    device: auto           # USB mic on Logitech C920
    available: true        # Logitech C920 USB mic
  inmp441:
    # I2S pins now free: GPIO18(BCLK), GPIO19(LRCLK), GPIO20(DIN), GPIO21(DOUT)
    # Overlay already in /boot/firmware/config.txt: dtoverlay=inmp441-pi5
    # To switch from C920 to INMP441: set device to hw:1,0 and set available: true
    device: hw:1,0
    available: false       # set true + rewire PWMA from Pin12→Pin32 first
  speaker:
    device: auto           # JBL Flip 5 BT via PipeWire
    available: true

  # Removed (Phase A — voice assistant stripped):
  #   whisper, piper, wake_word, ollama sections deleted.
  # Re-add only if re-enabling voice features in a future phase.

behavior_tree:
  tick_interval_ms: 100
  greet_cooldown_s: 300
  boredom_med_threshold_s: 60
  boredom_high_threshold_s: 180
  energy_sleep_threshold: 0.20
  gesture_cooldown_s: 3.0
  gesture_min_confidence: 0.75
  gesture_wave_hold_frames: 2

sounds:
  backend: sounddevice
  fallback: paplay
  device: default
